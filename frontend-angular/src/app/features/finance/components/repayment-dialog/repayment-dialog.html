<form
  class="card w-[min(28rem,calc(100vw-1.5rem))] p-6 anim-pop shadow-modal"
  (ngSubmit)="submit()"
  role="dialog"
  aria-labelledby="rep-title"
>
  <h2 id="rep-title" class="text-lg font-bold mb-1">
    {{ received ? 'Remboursement reçu' : 'Remboursement versé' }}
  </h2>
  <p class="text-sm text-muted mb-4">
    {{ loan.person }} — reste dû {{ money(loan.remaining) }} sur {{ money(loan.principal) }}. Un
    remboursement partiel est possible.
  </p>
  <div class="space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="field-label" for="rep-amount">Montant</label>
        <input
          id="rep-amount"
          name="amount"
          class="input text-right tabular-nums"
          inputmode="decimal"
          autocomplete="off"
          [ngModel]="amount()"
          (ngModelChange)="amount.set($event); error.set('')"
          cdkFocusInitial
        />
      </div>
      <div>
        <label class="field-label" for="rep-date">Date</label>
        <input
          id="rep-date"
          name="date"
          type="date"
          class="input"
          [max]="today"
          [ngModel]="date()"
          (ngModelChange)="date.set($event); error.set('')"
        />
      </div>
    </div>
    <div>
      <label class="field-label" for="rep-account">{{
        received ? 'Compte crédité' : 'Compte débité'
      }}</label>
      <select
        id="rep-account"
        name="account"
        class="input"
        [ngModel]="accountId()"
        (ngModelChange)="accountId.set($event)"
      >
        @for (a of accounts(); track a.id) {
          <option [value]="a.id">{{ a.name }}</option>
        }
      </select>
    </div>
    @if (error()) {
      <p class="field-error" role="alert">{{ error() }}</p>
    }
  </div>
  <div class="flex justify-end gap-2 mt-6">
    <button type="button" class="btn btn-secondary" (click)="ref.close()">Annuler</button>
    <button type="submit" class="btn btn-primary" [disabled]="saving()">Enregistrer</button>
  </div>
</form>
