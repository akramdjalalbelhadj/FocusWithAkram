<form
  class="card w-[min(28rem,calc(100vw-1.5rem))] p-6 anim-pop shadow-modal"
  (ngSubmit)="submit()"
  role="dialog"
  aria-labelledby="pur-title"
>
  <h2 id="pur-title" class="text-lg font-bold mb-1">Acheter « {{ goal.name }} »</h2>
  <p class="text-sm text-muted mb-4">
    Prix estimé {{ money(goal.estimatedPrice) }}. La dépense sera enregistrée comme payée et la
    réservation de {{ money(goal.reservedAmount) }} libérée.
  </p>
  <div class="space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="field-label" for="pur-amount">Prix payé</label>
        <input
          id="pur-amount"
          name="amount"
          class="input text-right tabular-nums"
          inputmode="decimal"
          autocomplete="off"
          [ngModel]="amount()"
          (ngModelChange)="amount.set($event); error.set('')"
          cdkFocusInitial
        />
      </div>
      <div>
        <label class="field-label" for="pur-date">Date</label>
        <input
          id="pur-date"
          name="date"
          type="date"
          class="input"
          [max]="today"
          [ngModel]="date()"
          (ngModelChange)="date.set($event); error.set('')"
        />
      </div>
    </div>
    <div>
      <label class="field-label" for="pur-cat">Catégorie</label>
      <select
        id="pur-cat"
        name="category"
        class="input"
        [ngModel]="categoryId()"
        (ngModelChange)="categoryId.set($event)"
      >
        <option value="" disabled>Choisir…</option>
        @for (c of categories(); track c.id) {
          <optgroup [label]="c.name">
            <option [value]="c.id">{{ c.name }} (général)</option>
            @for (s of c.children; track s.id) {
              <option [value]="s.id">{{ s.name }}</option>
            }
          </optgroup>
        }
      </select>
    </div>
    @if (error()) {
      <p class="field-error" role="alert">{{ error() }}</p>
    }
  </div>
  <div class="flex justify-end gap-2 mt-6">
    <button type="button" class="btn btn-secondary" (click)="ref.close()">Annuler</button>
    <button type="submit" class="btn btn-primary" [disabled]="saving()">Enregistrer l’achat</button>
  </div>
</form>
