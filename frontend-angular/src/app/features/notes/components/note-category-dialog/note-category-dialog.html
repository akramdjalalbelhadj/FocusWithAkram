<form
  class="card w-[min(28rem,calc(100vw-1.5rem))] p-6 anim-pop shadow-modal"
  [formGroup]="form"
  (ngSubmit)="submit()"
  role="dialog"
  aria-labelledby="nc-title"
>
  <h2 id="nc-title" class="text-lg font-bold mb-4">
    {{ data ? 'Modifier la catégorie' : 'Nouvelle catégorie' }}
  </h2>
  <div class="space-y-4">
    <div>
      <label class="field-label" for="nc-name">Nom</label>
      <input
        id="nc-name"
        class="input"
        formControlName="name"
        maxlength="60"
        placeholder="ex. Personnel, Professionnel, Technique"
        cdkFocusInitial
        [attr.aria-invalid]="form.controls.name.invalid && form.controls.name.touched"
      />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <p class="field-error">Le nom est obligatoire (60 caractères maximum).</p>
      }
      @if (error()) {
        <p class="field-error" role="alert">{{ error() }}</p>
      }
    </div>
    <fieldset>
      <legend class="field-label">Couleur</legend>
      <div class="flex flex-wrap gap-2" role="radiogroup">
        @for (c of colors; track c) {
          <label
            class="cursor-pointer has-[:focus-visible]:outline-2 outline-offset-2 rounded-full"
          >
            <input type="radio" class="sr-only-text" formControlName="color" [value]="c" />
            <span
              class="grid place-items-center size-8 rounded-full border-2"
              [style.background]="c"
              [style.border-color]="form.value.color === c ? 'var(--fg)' : 'transparent'"
            >
              @if (form.value.color === c) {
                <ff-icon name="check" [size]="14" class="text-white" />
              }
            </span>
            <span class="sr-only-text">{{ c }}</span>
          </label>
        }
      </div>
    </fieldset>
  </div>
  <div class="flex justify-end gap-2 mt-6">
    <button type="button" class="btn btn-secondary" (click)="ref.close()">Annuler</button>
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ data ? 'Enregistrer' : 'Créer' }}
    </button>
  </div>
</form>
