<div class="flex flex-col items-center justify-center text-center gap-2 py-8 px-4">
  <span class="grid place-items-center size-12 rounded-2xl bg-surface-2 text-subtle"
    ><ff-icon [name]="icon()" [size]="24"
  /></span>
  <p class="font-semibold text-fg">{{ title() }}</p>
  @if (hint()) {
    <p class="text-sm text-muted max-w-xs">{{ hint() }}</p>
  }
  <ng-content />
</div>
