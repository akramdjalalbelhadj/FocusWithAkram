<div class="relative" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <input
    class="input pr-20 tabular-nums"
    type="text"
    inputmode="numeric"
    placeholder="aaaa-mm-jj hh:mm"
    autocomplete="off"
    [id]="inputId()"
    [value]="text()"
    [disabled]="disabled()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-label]="ariaLabel()"
    (input)="onType($any($event.target).value)"
    (blur)="commitText()"
    (keydown.enter)="commitText()"
  />
  <div class="absolute right-1 top-1/2 -translate-y-1/2 flex items-center">
    @if (text() && !disabled()) {
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-icon"
        aria-label="Effacer la date"
        (click)="clear()"
      >
        <ff-icon name="x" [size]="14" />
      </button>
    }
    <button
      type="button"
      class="btn btn-ghost btn-sm btn-icon"
      aria-label="Ouvrir le calendrier"
      [disabled]="disabled()"
      (click)="toggle()"
    >
      <ff-icon name="calendar-days" [size]="16" />
    </button>
  </div>
</div>
@if (invalid()) {
  <p class="field-error">Format attendu : aaaa-mm-jj hh:mm (ex. 2026-10-30 09:30).</p>
}

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="ff-transparent-backdrop"
  (backdropClick)="open.set(false)"
  (detach)="open.set(false)"
  (overlayKeydown)="onKey($event)"
>
  <div class="menu anim-pop p-3 w-[19rem]" role="dialog" aria-label="Choisir une date et une heure">
    <div class="flex items-center justify-between mb-2">
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-icon"
        aria-label="Mois précédent"
        (click)="shiftMonth(-1)"
      >
        <ff-icon name="chevron-left" [size]="16" />
      </button>
      <span class="font-semibold capitalize">{{ monthLabel() }}</span>
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-icon"
        aria-label="Mois suivant"
        (click)="shiftMonth(1)"
      >
        <ff-icon name="chevron-right" [size]="16" />
      </button>
    </div>
    <div class="grid grid-cols-7 text-center text-xs text-muted mb-1" aria-hidden="true">
      @for (d of weekdays(); track d) {
        <span class="py-1">{{ d }}</span>
      }
    </div>
    <div class="grid grid-cols-7 gap-0.5" role="grid">
      @for (cell of cells(); track cell.day) {
        <button
          type="button"
          role="gridcell"
          class="h-9 rounded-lg text-sm tabular-nums hover:bg-surface-2"
          [class.text-subtle]="!cell.inMonth"
          [class.bg-brand]="cell.day === draftDay()"
          [class.text-brand-fg]="cell.day === draftDay()"
          [class.font-bold]="cell.day === today()"
          [attr.aria-selected]="cell.day === draftDay()"
          (click)="pickDay(cell.day)"
        >
          {{ cell.n }}
        </button>
      }
    </div>
    <div class="flex items-center gap-2 mt-3 pt-3 border-t border-line">
      <ff-icon name="clock" [size]="16" />
      <input
        class="input !min-h-9 w-16 text-center tabular-nums"
        type="number"
        min="0"
        max="23"
        aria-label="Heures"
        [value]="pad(draftHour())"
        (input)="setHour($any($event.target).value)"
      />
      <span>:</span>
      <input
        class="input !min-h-9 w-16 text-center tabular-nums"
        type="number"
        min="0"
        max="59"
        step="5"
        aria-label="Minutes"
        [value]="pad(draftMinute())"
        (input)="setMinute($any($event.target).value)"
      />
      <span class="flex-1"></span>
      <button type="button" class="btn btn-ghost btn-sm" (click)="setNow()">Maintenant</button>
    </div>
    <div class="flex justify-end gap-2 mt-3">
      <button type="button" class="btn btn-secondary btn-sm" (click)="open.set(false)">
        Annuler
      </button>
      <button type="button" class="btn btn-primary btn-sm" (click)="apply()">Valider</button>
    </div>
  </div>
</ng-template>
