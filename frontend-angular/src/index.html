<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>FocusWithAkram</title>
    <base href="/" />
    <script>
      try {
        const t = localStorage.getItem('ff.theme');
        if (t === 'LIGHT' || t === 'DARK') document.documentElement.dataset.theme = t.toLowerCase();
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="FocusWithAkram : matrice d'Eisenhower et sessions Pomodoro pour organiser votre travail."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
