server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;

  # L'API est servie par le conteneur backend : meme origine, donc pas de CORS en production.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location /swagger-ui { proxy_pass http://backend:8080; }
  location /v3/api-docs { proxy_pass http://backend:8080; }

  # Fichiers hashes : cache long. index.html : jamais en cache.
  location ~* \.(js|css|woff2?|svg|ico|png)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
