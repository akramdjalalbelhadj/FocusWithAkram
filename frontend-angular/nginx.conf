server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # En-tetes de securite. Attention : un add_header dans un bloc location annule ceux du serveur ; ils sont donc
  # repetes dans les blocs qui fixent Cache-Control.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;

  # L'API est servie par le conteneur backend : meme origine, donc pas de CORS en production.
  # $http_host garde le port publie (8088) : le backend voit la meme origine que le navigateur, que l'on ouvre
  # localhost ou 127.0.0.1 ($host perdrait le port et ferait refuser les POST comme requetes CORS).
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location /swagger-ui { proxy_pass http://backend:8080; }
  location /v3/api-docs { proxy_pass http://backend:8080; }

  # Fichiers hashes : cache long. index.html : jamais en cache.
  location ~* \.(js|css|woff2?|svg|ico|png)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
  }
}
