spring:
  application:
    name: focusflow
  datasource:
    url: ${FOCUSFLOW_DB_URL:jdbc:postgresql://localhost:5432/focusflow}
    username: ${FOCUSFLOW_DB_USER:focusflow}
    password: ${FOCUSFLOW_DB_PASSWORD:focusflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 50
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  address: ${FOCUSFLOW_BIND_ADDRESS:127.0.0.1}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

focusflow:
  # Origines autorisees pour le CORS (le frontend Angular en dev).
  cors-allowed-origins: ${FOCUSFLOW_CORS_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
