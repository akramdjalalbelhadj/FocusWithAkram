# Developpement : uniquement PostgreSQL (le backend et le frontend tournent en local).
#   docker compose -f docker-compose.dev.yml up -d
#   cd backend && mvn spring-boot:run          # utilise jdbc:postgresql://localhost:5432/focusflow
name: focusflow-dev

services:
  db:
    # PostgreSQL 18, comme le profil local ; volume monte sur /var/lib/postgresql (organisation de l'image 18).
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: focusflow
      POSTGRES_USER: focusflow
      POSTGRES_PASSWORD: focusflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - focusflow-dev-db:/var/lib/postgresql

volumes:
  focusflow-dev-db:
